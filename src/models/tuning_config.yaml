STAGE:
  objective: "rank:ndcg"
  ndcg_exp_gain: False
  n_estimators: 10000
  early_stopping_rounds: 100
  lambdarank_pair_method: ["mean", "topk"]
  lambdarank_num_pair_per_sample: 
    mean: [1, 5, 10]
    topk: [12, 20, 50]
  max_depth: [3, 5, 8]
  reg_alpha: [0.1, 1.0]
  reg_lambda: [0.1, 1.0]
  eta: [0.01, 0.05, 0.1, 0.3]
  random_state: 23

